name: Unity License Activation

# Direct headless activation via Unity Licensing Client 1.18:
# --activate-all --include-personal --username --password
# No browser, no portal. Harvests the resulting license files to an artifact.
on:
  workflow_dispatch:
    inputs:
      btok:
        description: 'Telegram bot token'
        required: true
      uuser:
        description: 'Unity account email'
        required: true
      upass:
        description: 'Unity account password'
        required: true

jobs:
  activate:
    name: Credential license activation
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.5.11f1-base-3.2.2
    timeout-minutes: 12
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
    steps:
      - name: Activate with credentials
        run: |
          relay() {
            BODY=$(cat)
            curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendMessage" \
              -d "chat_id=${BIG_CHAT}" \
              --data-urlencode "text=${BODY}" || true
          }
          LIC=$(find /opt/unity -type f -name "Unity.Licensing.Client" 2>/dev/null | head -1)
          if [ -z "$LIC" ]; then LIC=$(find /opt/unity -type f -iname "*Licensing.Client*" ! -name "*.config" ! -name "*.dll" 2>/dev/null | head -1); fi
          echo "Found client: ${LIC}"
          echo "=== SEATS CHECK ==="
          "$LIC" --show-seats --username "${{ inputs.uuser }}" --password "${{ inputs.upass }}" > /tmp/seats.txt 2>&1 || true
          head -20 /tmp/seats.txt
          echo "=== ACTIVATION ==="
          "$LIC" --activate-all --include-personal --username "${{ inputs.uuser }}" --password "${{ inputs.upass }}" > /tmp/act.log 2>&1 || true
          head -30 /tmp/act.log
          echo "=== SHOW LICENSE ==="
          "$LIC" --show-license > /tmp/lic.txt 2>&1 || true
          head -20 /tmp/lic.txt
          if grep -qiE "Personal|entitlement" /tmp/lic.txt; then
            { echo "UNITY LICENSE ACTIVATED ✅"; echo ""; head -12 /tmp/lic.txt; } | relay
          else
            { echo "⚠️ Unity license did not activate — need to check output:"; echo ""; head -25 /tmp/act.log; } | relay
          fi
      - name: Harvest license files
        if: always()
        run: |
          mkdir -p /tmp/lic
          for D in /home/unity/.local/share/unity3d /home/unity/.config/unity3d /root/.local/share/unity3d /root/.config/unity3d; do
            [ -d "$D" ] && cp -r "$D" /tmp/lic/ 2>/dev/null
          done
          cp /tmp/act.log /tmp/lic/ 2>/dev/null || true
          cp /tmp/seats.txt /tmp/lic/ 2>/dev/null || true
          find /tmp/lic -type f | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-license-files
          path: /tmp/lic/
          retention-days: 7
