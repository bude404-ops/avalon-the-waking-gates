name: Unity Device-Code Activation

# Live activation: Unity 6 licensing client prints a sign-in URL + code.
# The runner posts the client output to issue #2 the moment it appears,
# polls until the license activates, then harvests license files.
on:
  workflow_dispatch:
  push:
    paths:
      - 'trigger/activate-license.txt'

permissions:
  issues: write
  contents: read

jobs:
  activate:
    name: Device-code license activation
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.5.11f1-base-3.2.2
    timeout-minutes: 20
    env:
      RELAY_ISSUE: "2"
      GH_API: "https://api.github.com/repos/bude404-ops/avalon-the-waking-gates"
    steps:
      - name: Relay setup
        run: |
          echo "GITHUB_TOKEN length: ${#GITHUB_TOKEN}"
      - name: Help + activation attempt + live relay
        run: |
          relay() {
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GH_API/issues/$RELAY_ISSUE/comments" \
              -d "{\"body\": $(python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))" <<< "$1")}" || true
          }
          LIC="/opt/unity/editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          echo "=== LICENSING CLIENT HELP ===" | tee /tmp/help.txt
          "$LIC" --help 2>&1 | head -60 | tee -a /tmp/help.txt || true
          relay "$(cat /tmp/help.txt)"
          echo "=== STARTING ACTIVATION ==="
          nohup "$LIC" --activate-license > /tmp/act.log 2>&1 &
          echo $! > /tmp/act.pid
          sleep 25
          echo "=== ACTIVATION CLIENT OUTPUT ==="
          cat /tmp/act.log || true
          relay "ACTIVATION CLIENT OUTPUT:

$(cat /tmp/act.log 2>/dev/null)

If there is a URL + code above: open the URL, sign in with the Unity account, enter the code, approve."
          echo "=== POLLING UP TO 15 MIN FOR ACTIVATION ==="
          for i in $(seq 1 85); do
            if "$LIC" --show-license 2>/dev/null | grep -qiE "Personal|entitlement"; then
              echo "=== LICENSE DETECTED AT LOOP $i ==="
              relay "LICENSE ACTIVATED on runner (loop $i). Harvesting."
              break
            fi
            sleep 10
          done
          echo "=== SHOW LICENSE ==="
          "$LIC" --show-license 2>&1 | tee /tmp/lic.txt || true
          relay "SHOW-LICENSE RESULT:

$(cat /tmp/lic.txt 2>/dev/null | head -30)"
          kill $(cat /tmp/act.pid) 2>/dev/null || true
      - name: Harvest license files
        if: always()
        run: |
          mkdir -p /tmp/lic
          for D in /home/unity/.local/share/unity3d /home/unity/.config/unity3d /root/.local/share/unity3d /root/.config/unity3d; do
            [ -d "$D" ] && cp -r "$D" /tmp/lic/ 2>/dev/null
          done
          find /tmp/lic -type f | head -40
          cp /tmp/act.log /tmp/lic/ 2>/dev/null || true
          cp /tmp/help.txt /tmp/lic/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-device-license
          path: /tmp/lic/
          retention-days: 7
