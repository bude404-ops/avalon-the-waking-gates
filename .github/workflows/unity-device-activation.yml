name: Unity Device-Code Activation

# Live activation: Unity 6 licensing client prints a sign-in URL + code.
# Runner posts client output to issue #2, polls until license activates,
# then harvests license files into an artifact.
on:
  workflow_dispatch:
  push:
    paths:
      - 'trigger/activate-license.txt'

permissions:
  issues: write
  contents: read

jobs:
  activate:
    name: Device-code license activation
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.5.11f1-base-3.2.2
    timeout-minutes: 20
    env:
      RELAY_ISSUE: "2"
      GH_API: "https://api.github.com/repos/bude404-ops/avalon-the-waking-gates"
    steps:
      - name: Activation with live relay
        run: |
          relay() {
            BODY=$(cat)
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GH_API/issues/$RELAY_ISSUE/comments" -d "{\"body\": $(python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))" <<< "$BODY")}" || true
          }
          LIC="/opt/unity/editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          "$LIC" --help > /tmp/help.txt 2>&1 || true
          echo "LICENSING CLIENT HELP:" ; echo "" ; head -60 /tmp/help.txt | relay
          nohup "$LIC" --activate-license > /tmp/act.log 2>&1 &
          echo $! > /tmp/act.pid
          sleep 25
          { echo "ACTIVATION CLIENT OUTPUT:" ; echo "" ; cat /tmp/act.log 2>/dev/null ; echo "" ; echo "If there is a URL + code above: open the URL, sign in with the Unity account, enter the code, approve." ; } | relay
          for i in $(seq 1 85); do
            if "$LIC" --show-license 2>/dev/null | grep -qiE "Personal|entitlement"; then
              echo "LICENSE ACTIVATED on runner (loop $i)." | relay
              break
            fi
            sleep 10
          done
          "$LIC" --show-license > /tmp/lic.txt 2>&1 || true
          { echo "SHOW-LICENSE RESULT:" ; echo "" ; head -30 /tmp/lic.txt 2>/dev/null ; } | relay
          kill $(cat /tmp/act.pid) 2>/dev/null || true
      - name: Harvest license files
        if: always()
        run: |
          mkdir -p /tmp/lic
          for D in /home/unity/.local/share/unity3d /home/unity/.config/unity3d /root/.local/share/unity3d /root/.config/unity3d; do
            [ -d "$D" ] && cp -r "$D" /tmp/lic/ 2>/dev/null
          done
          cp /tmp/act.log /tmp/lic/ 2>/dev/null || true
          cp /tmp/help.txt /tmp/lic/ 2>/dev/null || true
          find /tmp/lic -type f | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-device-license
          path: /tmp/lic/
          retention-days: 7
