name: Unity Device-Code Activation

# Live activation: finds the Unity licensing client, starts activation,
# DMs Big the sign-in URL/code via Telegram the moment it appears,
# polls until the license activates, then harvests license files.
on:
  workflow_dispatch:
    inputs:
      btok:
        description: 'Telegram bot token'
        required: true
  push:
    paths:
      - 'trigger/activate-license.txt'

jobs:
  activate:
    name: Device-code license activation
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.5.11f1-base-3.2.2
    timeout-minutes: 20
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
    steps:
      - name: Find client, activate, relay to Telegram
        run: |
          relay() {
            BODY=$(cat)
            curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendMessage" \
              -d "chat_id=${BIG_CHAT}" \
              --data-urlencode "text=${BODY}" || true
          }
          echo "BTOK length: ${#BTOK}" | relay
          LIC=$(find /opt/unity -type f -iname "*Licensing.Client*" 2>/dev/null | head -1)
          echo "Found client: ${LIC}"
          if [ -z "$LIC" ]; then
            echo "Searching wider..."; find / -maxdepth 6 -type f -iname "*Licensing*Client*" 2>/dev/null | grep -v proc | head -10
            { echo "NO LICENSING CLIENT BINARY FOUND — searched /opt/unity and wider. See run logs for search results."; } | relay
            exit 1
          fi
          "$LIC" --help > /tmp/help.txt 2>&1 || true
          { echo "LICENSING CLIENT HELP:"; echo ""; head -60 /tmp/help.txt; } | relay
          nohup "$LIC" --activate-license > /tmp/act.log 2>&1 &
          echo $! > /tmp/act.pid
          sleep 25
          { echo "ACTIVATION CLIENT OUTPUT:"; echo ""; cat /tmp/act.log 2>/dev/null; echo ""; echo "If there is a URL + code above: open the URL, sign in with the Unity account, enter the code, approve."; } | relay
          for i in $(seq 1 85); do
            if "$LIC" --show-license 2>/dev/null | grep -qiE "Personal|entitlement"; then
              echo "LICENSE ACTIVATED on runner (loop $i). Harvesting now." | relay
              break
            fi
            sleep 10
          done
          "$LIC" --show-license > /tmp/lic.txt 2>&1 || true
          { echo "SHOW-LICENSE RESULT:"; echo ""; head -30 /tmp/lic.txt 2>/dev/null; } | relay
          kill $(cat /tmp/act.pid) 2>/dev/null || true
      - name: Harvest license files
        if: always()
        run: |
          mkdir -p /tmp/lic
          for D in /home/unity/.local/share/unity3d /home/unity/.config/unity3d /root/.local/share/unity3d /root/.config/unity3d; do
            [ -d "$D" ] && cp -r "$D" /tmp/lic/ 2>/dev/null
          done
          cp /tmp/act.log /tmp/lic/ 2>/dev/null || true
          cp /tmp/help.txt /tmp/lic/ 2>/dev/null || true
          find /tmp/lic -type f | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-device-license
          path: /tmp/lic/
          retention-days: 7
