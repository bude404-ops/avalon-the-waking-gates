name: Forge Build

# AUTO-FORGE on the CI seat: license activation + Unity batch + Forge pipeline (stages 2-7)
# Input model is staged from the repo vault (models/generated) into the unity project.
on:
  workflow_dispatch:
    inputs:
      btok:
        description: 'Telegram bot token'
        required: true
      uuser:
        description: 'Unity account email'
        required: true
      upass:
        description: 'Unity account password'
        required: true
      character:
        description: 'Character/class name'
        required: false
        default: 'Sovereign'
      inputf:
        description: 'Vault path of rigged FBX/GLB (repo-relative)'
        required: false
        default: 'models/generated/AEDAN-RIGGED-V5.fbx'
      height:
        description: 'Class height in meters'
        required: false
        default: '1.85'
      vcode:
        description: 'APK bundleVersionCode'
        required: false
        default: '101'

jobs:
  forge:
    name: Forge pipeline run
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.5.11f1-base-3.2.2
    timeout-minutes: 30
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
    steps:
      - uses: actions/checkout@v4
      - name: Activate license
        run: |
          LIC=$(find /opt/unity -type f -name "Unity.Licensing.Client" 2>/dev/null | head -1)
          if [ -z "$LIC" ]; then LIC=$(find /opt/unity -type f -iname "*Licensing.Client*" ! -name "*.config" ! -name "*.dll" 2>/dev/null | head -1); fi
          "$LIC" --activate-all --include-personal --username "${{ inputs.uuser }}" --password "${{ inputs.upass }}" > /tmp/act.log 2>&1 || true
          grep -qiE "ASSIGN_SEAT|successfully" /tmp/act.log && echo "LICENSE OK" || (echo "LICENSE FAILED"; head -20 /tmp/act.log; exit 1)
      - name: Stage input model + project scaffold
        run: |
          mkdir -p unity/ProjectSettings unity/Packages unity/Assets/AvalonForge/Generated
          printf 'm_EditorVersion: 6000.5.11f1\nm_EditorVersionWithRevision: 6000.5.11f1 (xxxxxxxxxxxx)\n' > unity/ProjectSettings/ProjectVersion.txt
          printf '{"dependencies":{"com.unity.ugui":"2.0.0","com.unity.modules.animation":"1.0.0","com.unity.modules.imgui":"1.0.0","com.unity.modules.jsonserialize":"1.0.0","com.unity.modules.uielements":"1.0.0","com.unity.modules.ui":"1.0.0","com.unity.modules.unitywebrequest":"1.0.0","com.unity.modules.androidjni":"1.0.0","com.unity.modules.physics":"1.0.0"}}\n' > unity/Packages/manifest.json
          cp "${{ inputs.inputf }}" "unity/Assets/AvalonForge/Generated/${{ inputs.character }}-M.fbx" && echo "STAGED: ${{ inputs.inputf }}"
      - name: Run Forge
        id: forge
        run: |
          set +e
          CODE=127
          UARGS="-batchmode -quit -logFile $GITHUB_WORKSPACE/unity-editor.log -projectPath $GITHUB_WORKSPACE/unity -executeMethod AvalonForge.Forge.Run -character ${{ inputs.character }} -input Assets/AvalonForge/Generated/${{ inputs.character }}-M.fbx -height ${{ inputs.height }}"
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a /opt/unity/Editor/Unity $UARGS
            CODE=$?
          else
            /opt/unity/Editor/Unity $UARGS
            CODE=$?
          fi
          if [ "$CODE" -ne 0 ]; then
            echo "First attempt exit $CODE — retrying with -nographics (structural QC only)"
            /opt/unity/Editor/Unity -batchmode -quit -nographics $UARGS
            CODE=$?
          fi
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "UNITY EXIT: $CODE"
          exit 0
      - name: Relay status
        if: always()
        run: |
          relay() {
            BODY=$(cat)
            curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendMessage" -d "chat_id=${BIG_CHAT}" --data-urlencode "text=${BODY}" || true
          }
          CODE="${{ steps.forge.outputs.exit_code }}"
          REPORT=$(find unity/Assets/AvalonForge/Reports -type f 2>/dev/null | head -1)
          if [ "$CODE" = "0" ] && [ -n "$REPORT" ]; then
            { echo "FORGE BUILD COMPLETE ✅ (${{ inputs.character }})"; echo ""; tail -15 "$REPORT"; } | relay
          else
            echo "FORGE BUILD FAILED (exit=$CODE) — silent per Big's preference; errors handled in CI logs"
          fi
      - name: Harvest artifacts
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -r unity/Assets/AvalonForge /tmp/out/ 2>/dev/null || true
          cp unity-editor.log /tmp/out/ 2>/dev/null || true
          find /tmp/out -type f | head -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-output-${{ inputs.character }}
          path: /tmp/out/
          retention-days: 14


  apk:
    name: AVALON Unity shell APK
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.5.11f1-android-3.2.2
    timeout-minutes: 40
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
    steps:
      - uses: actions/checkout@v4
      - name: Activate license
        run: |
          LIC=$(find /opt/unity -type f -name "Unity.Licensing.Client" 2>/dev/null | head -1)
          if [ -z "$LIC" ]; then LIC=$(find /opt/unity -type f -iname "*Licensing.Client*" ! -name "*.config" ! -name "*.dll" 2>/dev/null | head -1); fi
          "$LIC" --activate-all --include-personal --username "${{ inputs.uuser }}" --password "${{ inputs.upass }}" > /tmp/act.log 2>&1 || true
          grep -qiE "ASSIGN_SEAT|successfully" /tmp/act.log && echo "LICENSE OK" || (echo "LICENSE FAILED"; head -20 /tmp/act.log; exit 1)
      - name: Stage input model + project scaffold
        run: |
          mkdir -p unity/ProjectSettings unity/Packages unity/Assets/AvalonForge/Generated
          printf 'm_EditorVersion: 6000.5.11f1\nm_EditorVersionWithRevision: 6000.5.11f1 (xxxxxxxxxxxx)\n' > unity/ProjectSettings/ProjectVersion.txt
          printf '{"dependencies":{"com.unity.ugui":"2.0.0","com.unity.modules.animation":"1.0.0","com.unity.modules.imgui":"1.0.0","com.unity.modules.jsonserialize":"1.0.0","com.unity.modules.uielements":"1.0.0","com.unity.modules.ui":"1.0.0","com.unity.modules.physics":"1.0.0","com.unity.modules.unitywebrequest":"1.0.0","com.unity.modules.androidjni":"1.0.0"}}\n' > unity/Packages/manifest.json
          cp "${{ inputs.inputf }}" "unity/Assets/AvalonForge/Generated/${{ inputs.character }}-M.fbx" && echo "STAGED: ${{ inputs.inputf }}"
      - name: Run Forge (prefab + animator)
        run: |
          set +e
          xvfb-run -a /opt/unity/Editor/Unity -batchmode -quit -logFile $GITHUB_WORKSPACE/unity-editor.log -projectPath $GITHUB_WORKSPACE/unity -executeMethod AvalonForge.Forge.Run -character ${{ inputs.character }} -input Assets/AvalonForge/Generated/${{ inputs.character }}-M.fbx -height ${{ inputs.height }}
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            echo "Forge exit $CODE — retrying with -nographics"
            /opt/unity/Editor/Unity -batchmode -quit -nographics -logFile $GITHUB_WORKSPACE/unity-editor.log -projectPath $GITHUB_WORKSPACE/unity -executeMethod AvalonForge.Forge.Run -character ${{ inputs.character }} -input Assets/AvalonForge/Generated/${{ inputs.character }}-M.fbx -height ${{ inputs.height }}
            CODE=$?
          fi
          echo "FORGE EXIT: $CODE"
          [ "$CODE" -eq 0 ] || exit 1
      - name: Surface compile errors
        if: failure()
        run: grep -E "error CS[0-9]+" $GITHUB_WORKSPACE/unity-editor.log | head -40 || true
      - name: Upload editor log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-log
          path: ${{ github.workspace }}/unity-editor.log
      - name: Build AVALON shell APK
        run: |
          export AVALON_APK_OUT=$GITHUB_WORKSPACE/build/avalon-unity-shell.apk
          export AVALON_VCODE=${{ inputs.vcode || '101' }}
          export AVALON_KEYSTORE=$GITHUB_WORKSPACE/unity/AVALON-DEMO.keystore
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/opt/android/sdk}
          export ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-/opt/android/ndk}
          export JAVA_HOME=${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}
          xvfb-run -a /opt/unity/Editor/Unity -batchmode -quit -logFile $GITHUB_WORKSPACE/shell-build.log -projectPath $GITHUB_WORKSPACE/unity -executeMethod AvalonShell.AvalonShellBuild.BuildForAndroid
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            echo "SHELL BUILD FAILED (exit=$CODE) — errors from log:"
            grep -E "\[SHELL\]\[ERR\]|Exception|error CS" $GITHUB_WORKSPACE/shell-build.log | head -20 || true
            exit 1
          fi
          ls -la $GITHUB_WORKSPACE/build/
      - name: Launcher guarantee (verify + deterministic patch)
        run: |
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/opt/android/sdk}
          APKS=$(find /usr/local/lib/android/sdk /opt/android/sdk -maxdepth 3 -name apksigner -path "*build-tools*" 2>/dev/null | sort -V | tail -1 || true)
          ZIPAL=""
          if [ -n "$APKS" ]; then ZIPAL=$(dirname "$APKS")/zipalign; fi
          if [ -z "$APKS" ]; then
            echo "SDK apksigner not found - downloading build-tools r34"
            curl -sL -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
            (cd /tmp && unzip -q -o bt.zip -d bt)
            APKS=$(find /tmp/bt -name apksigner | head -1); ZIPAL=$(dirname "$APKS")/zipalign
          fi
          JAVACAND=$(find /usr/lib/jvm /usr/java -name java -type f 2>/dev/null | head -1 || true)
          if [ -z "$JAVACAND" ]; then
            echo "no JVM found - downloading temurin 17 JRE"
            curl -sL -o /tmp/jre.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jre/hotspot/normal/eclipse"
            mkdir -p /tmp/jre && tar -xzf /tmp/jre.tar.gz -C /tmp/jre --strip-components=1
            JAVACAND=/tmp/jre/bin/java
          fi
          export PATH="$(dirname "$JAVACAND"):$PATH"
          echo "java: $(which java || echo missing)"
          echo "apksigner: $APKS"
          APK=$GITHUB_WORKSPACE/build/avalon-unity-shell.apk
          [ -f "$APK" ] || { echo "no apk"; exit 1; }
          python3 -m pip install -q androguard 2>/dev/null || pip install -q androguard 2>/dev/null || pip3 install -q androguard 2>/dev/null || true
          if python3 tools/apk-preview/verify_launcher.py "$APK"; then
            echo "LAUNCHER PASS - shipping stock build"
          else
            echo "LAUNCHER FAIL - patching binary deterministically"
            curl -sL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.1/apktool_2.9.1.jar
            java -jar /tmp/apktool.jar d -f -q -o /tmp/dec "$APK"
            python3 tools/apk-preview/inject_launcher.py /tmp/dec/AndroidManifest.xml
            java -jar /tmp/apktool.jar b -q /tmp/dec -o /tmp/fixed-unsigned.apk
            "$ZIPAL" -f 4 /tmp/fixed-unsigned.apk /tmp/fixed-aligned.apk
            "$APKS" sign --ks $GITHUB_WORKSPACE/unity/AVALON-DEMO.keystore --ks-pass pass:bigfoot404-gates --ks-key-alias avalon --key-pass pass:bigfoot404-gates --out "$APK" /tmp/fixed-aligned.apk
            python3 tools/apk-preview/verify_launcher.py "$APK" || { echo "PATCH FAILED VERIFICATION"; exit 1; }
            echo "PATCHED + RESIGNED + VERIFIED"
          fi
      - name: SIGN GUARANTEE (always AVALON-DEMO, never trust Unity keystore)
        run: |
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/opt/android/sdk}
          APKS=$(find /usr/local/lib/android/sdk /opt/android/sdk -maxdepth 3 -name apksigner -path "*build-tools*" 2>/dev/null | sort -V | tail -1 || true)
          ZIPAL=""
          if [ -n "$APKS" ]; then ZIPAL=$(dirname "$APKS")/zipalign; fi
          if [ -z "$APKS" ]; then
            echo "SDK apksigner not found - downloading build-tools r34"
            curl -sL -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
            (cd /tmp && unzip -q -o bt.zip -d bt)
            APKS=$(find /tmp/bt -name apksigner | head -1); ZIPAL=$(dirname "$APKS")/zipalign
          fi
          JAVACAND=$(find /usr/lib/jvm /usr/java -name java -type f 2>/dev/null | head -1 || true)
          if [ -z "$JAVACAND" ]; then
            echo "no JVM found - downloading temurin 17 JRE"
            curl -sL -o /tmp/jre.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jre/hotspot/normal/eclipse"
            mkdir -p /tmp/jre && tar -xzf /tmp/jre.tar.gz -C /tmp/jre --strip-components=1
            JAVACAND=/tmp/jre/bin/java
          fi
          export PATH="$(dirname "$JAVACAND"):$PATH"
          echo "java: $(which java || echo missing)"
          echo "apksigner: $APKS"
          APK=$GITHUB_WORKSPACE/build/avalon-unity-shell.apk
          "$APKS" sign \
            --ks $GITHUB_WORKSPACE/unity/AVALON-DEMO.keystore \
            --ks-pass pass:bigfoot404-gates --ks-key-alias avalon --key-pass pass:bigfoot404-gates \
            "$APK"
          DN=$("$APKS" verify --print-certs "$APK" | grep -m1 "certificate DN")
          echo "$DN"
          echo "$DN" | grep -q "CN=AVALON Bigfoot404" || { echo "SIGN GUARANTEE FAILED - wrong cert"; exit 1; }
          python3 tools/apk-preview/verify_launcher.py "$APK" || { echo "launcher broke in re-sign"; exit 1; }
          echo "SIGNED + VERIFIED: AVALON-DEMO permanent base"
      - name: Harvest APK
        if: always()
        run: |
          mkdir -p /tmp/apkout && cp build/avalon-unity-shell.apk /tmp/apkout/ 2>/dev/null || echo "no apk produced"
          cp $GITHUB_WORKSPACE/shell-build.log /tmp/apkout/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalon-apk-${{ inputs.character }}
          path: /tmp/apkout/
          retention-days: 14
