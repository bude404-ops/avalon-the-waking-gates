<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aedan — Live 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0b0d; color:#c8c4bc; font-family:Georgia,serif; overflow:hidden; }
  .top { position:fixed; top:0; left:0; right:0; background:rgba(10,11,13,.92); padding:14px 18px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #22242b; z-index:10; }
  .top a { color:#a3895a; text-decoration:none; font-size:12px; letter-spacing:.18em; }
  .top .name { font-size:15px; letter-spacing:.12em; color:#e6ddca; }
  .top .sub { font-size:11px; color:#8a8578; letter-spacing:.14em; margin-top:2px; }
  #hud { position:fixed; bottom:0; left:0; right:0; background:rgba(10,11,13,.85); padding:10px 18px; font-size:11px; color:#8a8578; letter-spacing:.1em; z-index:10; display:flex; justify-content:space-between; }
  #hud b { color:#a3895a; font-weight:normal; }
  #stage { position:fixed; top:0; left:0; width:100%; height:100%; }
  #tip { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#6f6a5e; font-size:13px; letter-spacing:.2em; z-index:5; text-align:center; white-space:pre; }
  #err { position:fixed; top:70px; left:12px; right:12px; background:#2a1114; color:#ff8a8a; font:12px/1.5 monospace; padding:12px; border:1px solid #55262b; z-index:20; display:none; white-space:pre-wrap; }
  #anims { position:fixed; bottom:14px; left:0; right:0; display:flex; gap:8px; justify-content:center; z-index:30; }
  #anims button { background:rgba(20,22,26,.82); color:#a3895a; border:1px solid #33353d; padding:8px 14px; letter-spacing:.18em; font-size:10px; font-family:Georgia,serif; }
  #anims button.on { color:#e6ddca; border-color:#a3895a; background:rgba(163,137,90,.18); }
</style>
</head>
<body>
<div class="top">
  <a href="index.html">&larr; BACK</a>
  <div>
    <div class="name">MODEL LINE — REBUILDING ON AUTO-FORGE</div>
    <div class="sub">SOVEREIGN OF SKYREND &mdash; LIVE 3D MODEL</div>
  </div>
</div>
<div id="stage"></div>
<div id="tip">SUMMONING&hellip;</div>
<div id="err"></div>
<div id="anims"></div>
  <div id="hud"><span>DRAG TO ROTATE &bull; PINCH TO ZOOM</span><span id="stat">STARTING</span></div>
<script>
var statEl = document.getElementById('stat');
var tipEl = document.getElementById('tip');
var errEl = document.getElementById('err');
function stage(t) { statEl.textContent = t; }
function fatal(t) {
  errEl.style.display = 'block';
  errEl.textContent = 'ERROR \u2014 ' + t;
  tipEl.textContent = 'MODEL FAILED';
}
window.onerror = function(msg, src, line) { fatal(msg + ' @' + (src||'?') + ':' + (line||'?')); };
</script>
<script src="vendor/three.min.js" onerror="fatal('three.min.js failed to load')"></script>
<script src="vendor/GLTFLoader.js" onerror="fatal('GLTFLoader.js failed to load')"></script>
<script src="vendor/OrbitControls.js" onerror="fatal('OrbitControls.js failed to load')"></script>
<script>
try {
  if (typeof THREE === 'undefined') { fatal('THREE is undefined \u2014 vendor scripts did not execute'); throw new Error('no three'); }
  stage('SCRIPTS OK \u2022 WEBGL ' + (function(){ try { var c=document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl'))); } catch(e){ return false; } })());
  var stage_el = document.getElementById('stage');
  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage_el.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0e10);
  var camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.01, 100);
  var key = new THREE.DirectionalLight(0xfff4e2, 2.6); key.position.set(2, 3, 3); scene.add(key);
  var fill = new THREE.DirectionalLight(0xc0c8dc, 0.9); fill.position.set(-2, 1.5, -2.5); scene.add(fill);
  scene.add(new THREE.AmbientLight(0x808088, 0.55));
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 0.5; controls.maxDistance = 5;
  var mixer = null;
  var clock = new THREE.Clock();
  stage('FETCHING GLB\u2026');
  stage('MODEL LINE IN REBUILD \u2022 NEW PIPELINE');
  tipEl.innerHTML = 'The old model and its animation are retired \u2014 they did not survive the old pipeline. The first hero of the new AUTO-FORGE pipeline: the RAVAGER.';
  camera.position.set(1.2, 1.0, 2.2);
  controls.target.set(0, 0.6, 0);
  function tick() {
    requestAnimationFrame(tick);
    if (mixer) mixer.update(clock.getDelta());
    controls.update();
    renderer.render(scene, camera);
  }
  tick();
  addEventListener('resize', function() {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
} catch (e) { fatal('init: ' + e.message); }
</script>
</body>
</html>
